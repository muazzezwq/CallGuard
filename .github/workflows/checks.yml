name: checks

# The three gates every commit is supposed to pass, run on GitHub instead of in
# someone's terminal. They are cheap: `bun run check` is tsc + eslint, `bun test`
# needs no network, and `forge test` runs offline (the fork suites skip without an
# `ARC_RPC_URL`, which is why this job is safe on a stock runner).
#
# Deliberately not included: `vercel build`, deploys, and anything that needs a
# private key. A red run here means a commit is broken, nothing else.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run check
      - name: bun test
        shell: bash
        # A red run has to name its tests. The raw job log needs repository admin
        # rights, so a failure that only exists on the runner used to be unreadable
        # from outside: these annotations arrive on the check run itself.
        run: |
          bun test tests/ 2>&1 | tee /tmp/bun-test.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -E "^\(fail\)" /tmp/bun-test.log | head -15 | while IFS= read -r line; do
              echo "::error title=failing test::${line//\%/%25}"
            done
          fi
          exit "$status"

  contracts:
    runs-on: ubuntu-latest
    steps:
      # `lib/` holds git submodules (openzeppelin-contracts, forge-std).
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      - run: forge test
