specVersion: 0.0.5
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: ServiceRegistry
    network: arc-testnet
    source:
      address: "0x9ca97010464e8e6de6e27cf25eae9b939fbd7333"
      abi: ServiceRegistry
      startBlock: 19100000
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Provider
      abis:
        - name: ServiceRegistry
          file: ./abis/ServiceRegistry.json
      eventHandlers:
        - event: ProviderRegistered(indexed uint256,indexed address,address,uint256,uint256,uint32,uint32,string)
          handler: handleProviderRegistered
        - event: ProviderDeactivated(indexed uint256,uint32)
          handler: handleProviderDeactivated
        - event: ProviderUnstaked(indexed uint256,uint256)
          handler: handleProviderUnstaked
        - event: ProviderSlashed(indexed uint256,uint256,address)
          handler: handleProviderSlashed
        - event: PriceUpdated(indexed uint256,uint256)
          handler: handlePriceUpdated
        - event: SignerUpdated(indexed uint256,address)
          handler: handleSignerUpdated
        - event: ReputationUpdated(indexed uint256,uint64,uint64)
          handler: handleReputationUpdated
        - event: NFTBound(indexed uint256,indexed uint256)
          handler: handleNFTBound
        - event: ZkTierSet(indexed uint256,uint8)
          handler: handleZkTierSet
        - event: UptimeRecorded(indexed uint256,uint16)
          handler: handleUptimeRecorded
      file: ./src/mapping.ts

  - kind: ethereum
    name: PayPerCall
    network: arc-testnet
    source:
      address: "0x5fb41dd22c44e1de08f37d98c2995a62d6220540"
      abi: PayPerCall
      startBlock: 19100000
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Call
        - Provider
      abis:
        - name: PayPerCall
          file: ./abis/PayPerCall.json
      eventHandlers:
        - event: CallStarted(indexed bytes32,indexed uint256,indexed address,uint256,bytes32,uint32)
          handler: handleCallStarted
        - event: ReceiptSubmitted(indexed bytes32,bytes32)
          handler: handleReceiptSubmitted
        - event: CallSlashed(indexed bytes32,uint256,uint256)
          handler: handleCallSlashed
        - event: StealthCallStarted(indexed bytes32,indexed address)
          handler: handleStealthCallStarted
      file: ./src/mapping.ts

  - kind: ethereum
    name: CrossChainReceiver
    network: arc-testnet
    source:
      address: "0x760326de3cba39994dfd81d2b71b072c0265601c"
      abi: CrossChainReceiver
      startBlock: 50334164
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - CrossChainCall
        - Provider
      abis:
        - name: CrossChainReceiver
          file: ./abis/CrossChainReceiver.json
      eventHandlers:
        - event: CrossChainCallTriggered(indexed bytes32,indexed uint256,indexed address,uint256)
          handler: handleCrossChainCallTriggered
      file: ./src/mapping.ts

  - kind: ethereum
    name: RegisterWithNFT
    network: arc-testnet
    source:
      address: "0x0aBC433356754Cd269bEF9A46273d7a152a0F169"
      abi: RegisterWithNFT
      startBlock: 50334164
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - NFTRegistration
        - Provider
      abis:
        - name: RegisterWithNFT
          file: ./abis/RegisterWithNFT.json
      eventHandlers:
        - event: RegisteredWithNFT(indexed address,indexed uint256,indexed uint256,uint256)
          handler: handleRegisteredWithNFT
      file: ./src/mapping.ts
  - kind: ethereum
    name: AgenticCommerce
    network: arc-testnet
    source:
      address: "0x0747EEf0706327138c69792bF28Cd525089e4583"
      abi: AgenticCommerce
      startBlock: 50334164
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Job
        - JobCreated
      abis:
        - name: AgenticCommerce
          file: ./abis/AgenticCommerce.json
      eventHandlers:
        - event: JobCreated(indexed uint256,indexed address,indexed address,address,uint256,address)
          handler: handleJobCreated
      file: ./src/agenticCommerce.ts

  - kind: ethereum
    name: Dispute
    network: arc-testnet
    source:
      address: "0xa47162d8e4785d867f05800f35a334fd78575e56"
      abi: Dispute
      startBlock: 50334164
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - DisputeRecord
      abis:
        - name: Dispute
          file: ./abis/Dispute.json
      eventHandlers:
        - event: DisputeOpened(indexed uint256,indexed bytes32,indexed address,uint256)
          handler: handleDisputeOpened
        - event: DisputeResolved(indexed uint256,uint8,uint256)
          handler: handleDisputeResolved
      file: ./src/dispute.ts

  - kind: ethereum
    name: Subscription
    network: arc-testnet
    source:
      address: "0xc090ff2b856a5cc1bfe1137cf75ca566339f01db"
      abi: Subscription
      startBlock: 19100000
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Subscription
      abis:
        - name: Subscription
          file: ./abis/Subscription.json
      eventHandlers:
        - event: Subscribed(indexed uint256,indexed address,indexed uint256,uint32,uint64)
          handler: handleSubscribed
        - event: CallUsed(indexed uint256,uint32)
          handler: handleCallUsed
        - event: Cancelled(indexed uint256,uint256)
          handler: handleCancelled
        - event: ExpiredReleased(indexed uint256,uint256)
          handler: handleExpiredReleased
        - event: StreamSubscribed(indexed uint256,indexed address,indexed uint256,uint256,uint64)
          handler: handleStreamSubscribed
        - event: StreamClaimed(indexed uint256,indexed address,uint256)
          handler: handleStreamClaimed
      file: ./src/subscription.ts
