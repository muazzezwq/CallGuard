[profile.default]
src = "contracts"
out = "out"
libs = ["lib"]
solc_version = "0.8.37"
evm_version = "cancun"    # OZ v5.6+ requires mcopy (Cancun); Arc deploy uses --evm-version paris override
optimizer = true
optimizer_runs = 200
via_ir = true
gas_reports = ["ServiceRegistry", "PayPerCall"]
fs_permissions = [{ access = "read", path = "./test/fixtures" }]

[rpc_endpoints]
arc_testnet = "${ARC_TESTNET_RPC_URL}"

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = true
